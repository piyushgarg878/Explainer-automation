services:
  n8n:
    build: .
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      - GENERIC_TIMEZONE=${PUBLISH_TZ:-Asia/Kolkata}
      - TZ=${PUBLISH_TZ:-Asia/Kolkata}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - NODES_EXCLUDE=[]            # keep Execute Command enabled
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_home:/home/node/.n8n
      - ./data:/data                # runs/, history, outputs
      - ./scripts:/opt/scripts:ro
      - ./prompts:/opt/prompts:ro
      - ./schemas:/opt/schemas:ro
      - ./assets:/opt/assets:ro
volumes:
  n8n_home:
